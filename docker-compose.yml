services:
  mongodb:
    image: mongo:4.4
    container_name: pmp_mongodb
    ports:
      - "27018:27017"  # 本地 27018 → 容器內 27017
    environment:
      MONGO_INITDB_DATABASE: pmp_system
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - pmp_network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build: .
    container_name: pmp_web
    network_mode: "host"
    environment:
      - MONGODB_URI=mongodb://127.0.0.1:27018/pmp_system
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-pmp-secret-key-change-this-in-production}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  pmp_network:
    driver: bridge
